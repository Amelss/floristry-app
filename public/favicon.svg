<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#3D5C3A"/>

  <!-- 5 petals: one pointing up, rotated 72° each time around (16,16) -->
  <g fill="white" fill-opacity="0.93">
    <ellipse cx="16" cy="10" rx="2.6" ry="4.2" transform="rotate(0 16 16)"/>
    <ellipse cx="16" cy="10" rx="2.6" ry="4.2" transform="rotate(72 16 16)"/>
    <ellipse cx="16" cy="10" rx="2.6" ry="4.2" transform="rotate(144 16 16)"/>
    <ellipse cx="16" cy="10" rx="2.6" ry="4.2" transform="rotate(216 16 16)"/>
    <ellipse cx="16" cy="10" rx="2.6" ry="4.2" transform="rotate(288 16 16)"/>
  </g>

  <!-- Centre: dark cover then white dot -->
  <circle cx="16" cy="16" r="3.2" fill="#3D5C3A"/>
  <circle cx="16" cy="16" r="2.1" fill="white" fill-opacity="0.92"/>
</svg>
